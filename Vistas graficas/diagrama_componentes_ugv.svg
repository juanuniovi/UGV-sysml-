<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1150 760" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- Fondo oscuro para visualización en GitHub (modos claro y oscuro) -->
  <rect width="100%" height="100%" fill="#090d16" rx="16"/>

        <defs>
          <!-- Flechas para los flujos -->
          <marker id="arrow-info" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <polygon points="0 0, 8 3.5, 0 7" fill="#38bdf8" />
          </marker>
          <marker id="arrow-energy" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <polygon points="0 0, 8 3.5, 0 7" fill="#34d399" />
          </marker>
          <marker id="arrow-mech" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <polygon points="0 0, 8 3.5, 0 7" fill="#fbbf24" />
          </marker>
          <marker id="circle-marker" markerWidth="8" markerHeight="8" refX="4" refY="4">
            <circle cx="4" cy="4" r="3" fill="#94a3b8" />
          </marker>
        </defs>

        <!-- ============================================================== -->
        <!-- ZONA 1: ELEMENTOS DE CONTROL EXTERNO Y APOYO (Fuera del Vehículo) -->
        <!-- ============================================================== -->
        <rect x="30" y="30" width="1090" height="150" rx="16" fill="#0f172a" stroke="#334155" stroke-dasharray="6 6" stroke-width="1.5" />
        <text x="50" y="55" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">ELEMENTOS DE CONTROL EXTERNO Y APOYO (CONTRATO CDTI)</text>

        <!-- Puesto de Mando Portable (PMP) -->
        <g class="component-box cursor-pointer" id="comp-pmp">
          <rect x="50" y="75" width="280" height="85" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
          <text x="70" y="105" fill="#e0f2fe" font-size="14" font-weight="700">06. Puesto Mando Portable (PMP)</text>
          <text x="70" y="125" fill="#94a3b8" font-size="11">Estación rugerizada · GUI Linux · BLOS</text>
          <text x="70" y="142" fill="#38bdf8" font-size="10">Control táctico remoto a larga distancia</text>
        </g>

        <!-- Consola Portable Operador (CPT) -->
        <g class="component-box cursor-pointer" id="comp-cpt">
          <rect x="435" y="75" width="280" height="85" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
          <text x="455" y="105" fill="#e0f2fe" font-size="14" font-weight="700">06. Consola Portable (CPT)</text>
          <text x="455" y="125" fill="#94a3b8" font-size="11">Telemando táctico de mano · LOS directo</text>
          <text x="455" y="142" fill="#38bdf8" font-size="10">Maniobra visual cercana y acople fino</text>
        </g>

        <!-- UAV Apoyo Cenital -->
        <g class="component-box cursor-pointer" id="comp-uav">
          <rect x="820" y="75" width="280" height="85" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
          <text x="840" y="105" fill="#e0f2fe" font-size="14" font-weight="700">07. UAV Apoyo Cenital</text>
          <text x="840" y="125" fill="#94a3b8" font-size="11">Dron aéreo de exploración y relé RF</text>
          <text x="840" y="142" fill="#38bdf8" font-size="10">Recarga en techo del UGV</text>
        </g>

        <!-- ============================================================== -->
        <!-- ZONA 2: PLATAFORMA UGV PESADA (VEHÍCULO BASE A RUEDAS)         -->
        <!-- ============================================================== -->
        <rect x="30" y="220" width="760" height="510" rx="20" fill="#0f172a" stroke="#1d4ed8" stroke-width="2.5" />
        <rect x="45" y="235" width="260" height="28" rx="6" fill="#1e3a8a" />
        <text x="55" y="254" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1">01. PLATAFORMA UGV PESADA</text>

        <!-- 01. Barcaza y Chasis Estructural -->
        <g class="component-box cursor-pointer" id="comp-barcaza">
          <rect x="55" y="280" width="710" height="75" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
          <text x="75" y="310" fill="#fef3c7" font-size="14" font-weight="700">01. Barcaza Estructural y Chasis</text>
          <text x="75" y="332" fill="#94a3b8" font-size="11">Chasis en V anti-minas · Puntos de anclaje Frontal, Superior y Trasero · Cabestrante</text>
        </g>

        <!-- 05. Comunicaciones Embarcadas -->
        <g class="component-box cursor-pointer" id="comp-com">
          <rect x="55" y="380" width="330" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <text x="75" y="410" fill="#e0f2fe" font-size="13" font-weight="700">05. Comunicaciones Embarcadas</text>
          <text x="75" y="430" fill="#94a3b8" font-size="11">Data-link RF BLOS / LOS · Cifrado COMSEC</text>
          <text x="75" y="448" fill="#38bdf8" font-size="10">Recepción órdenes / Envío telemetría y vídeo</text>
        </g>

        <!-- 04. Navegación y Control (GNC) -->
        <g class="component-box cursor-pointer" id="comp-gnc">
          <rect x="435" y="380" width="330" height="90" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <text x="455" y="410" fill="#e0f2fe" font-size="13" font-weight="700">04. Navegación y Control (GNC)</text>
          <text x="455" y="430" fill="#94a3b8" font-size="11">Computador de misión · LiDAR · Cámaras 360°</text>
          <text x="455" y="448" fill="#38bdf8" font-size="10">Autonomía waypoints · Detect &amp; Avoid · VIO</text>
        </g>

        <!-- 03. Planta Motriz Híbrida -->
        <g class="component-box cursor-pointer" id="comp-motor">
          <rect x="55" y="500" width="330" height="105" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" />
          <text x="75" y="528" fill="#d1fae5" font-size="13" font-weight="700">03. Planta Motriz Híbrida</text>
          <text x="75" y="548" fill="#94a3b8" font-size="11">Motor biocombustible + Baterías tracción</text>
          <text x="75" y="566" fill="#34d399" font-size="10">Potencia nominal ≥ 140 kW · Modo silencioso ≥ 2 h</text>
          <text x="75" y="583" fill="#6ee7b7" font-size="10">Exportación de energía (120 kW) · PMS</text>
        </g>

        <!-- 02. Tren de Rodaje a Ruedas -->
        <g class="component-box cursor-pointer" id="comp-rodaje">
          <rect x="55" y="630" width="710" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
          <text x="75" y="658" fill="#fef3c7" font-size="13" font-weight="700">02. Tren de Rodaje a Ruedas Independientes</text>
          <text x="75" y="678" fill="#94a3b8" font-size="11">Tracción 4x4 / 6x6 / 8x8 · Motores eléctricos en rueda o ejes</text>
          <text x="75" y="696" fill="#fde68a" font-size="10">Suspensión neumática activa regulable en altura y retráctil</text>
        </g>

        <!-- ============================================================== -->
        <!-- ZONA 3: CARGAS DE PAGO MODULARES (Acopladas al UGV)            -->
        <!-- ============================================================== -->
        <rect x="820" y="220" width="280" height="510" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
        <rect x="835" y="235" width="250" height="28" rx="6" fill="#581c87" />
        <text x="845" y="254" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1">08. CARGAS DE PAGO (MISIÓN)</text>

        <g class="component-box cursor-pointer" id="comp-payload-istar">
          <rect x="840" y="280" width="240" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
          <text x="855" y="305" fill="#f5f3ff" font-size="12" font-weight="700">Módulo ISTAR</text>
          <text x="855" y="325" fill="#94a3b8" font-size="10">Mástil telescópico EO/IR</text>
          <text x="855" y="342" fill="#c4b5fd" font-size="10">Reconocimiento e inteligencia</text>
        </g>

        <g class="component-box cursor-pointer" id="comp-payload-log">
          <rect x="840" y="380" width="240" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
          <text x="855" y="405" fill="#f5f3ff" font-size="12" font-weight="700">Módulo Logístico</text>
          <text x="855" y="425" fill="#94a3b8" font-size="10">Plataforma porta-palets</text>
          <text x="855" y="442" fill="#c4b5fd" font-size="10">Transporte pesado en convoy</text>
        </g>

        <g class="component-box cursor-pointer" id="comp-payload-med">
          <rect x="840" y="480" width="240" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
          <text x="855" y="505" fill="#f5f3ff" font-size="12" font-weight="700">Módulo MEDEVAC</text>
          <text x="855" y="525" fill="#94a3b8" font-size="10">Soporte vital y camillas</text>
          <text x="855" y="542" fill="#c4b5fd" font-size="10">Evacuación médica de bajas</text>
        </g>

        <g class="component-box cursor-pointer" id="comp-payload-aux">
          <rect x="840" y="580" width="240" height="135" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
          <text x="855" y="605" fill="#f5f3ff" font-size="12" font-weight="700">Interfaces de Acople Rápido</text>
          <text x="855" y="625" fill="#94a3b8" font-size="10">• Potencia eléctrica CC / CA</text>
          <text x="855" y="642" fill="#94a3b8" font-size="10">• Bus de datos CAN / Ethernet</text>
          <text x="855" y="660" fill="#94a3b8" font-size="10">• Fijación mecánica universal</text>
          <text x="855" y="685" fill="#c4b5fd" font-size="10">Intercambio rápido en campo</text>
        </g>

        <!-- ============================================================== -->
        <!-- LÍNEAS DE CONEXIÓN Y FLUJOS                                    -->
        <!-- ============================================================== -->

        <!-- 1. FLUJOS DE INFORMACIÓN / CONTROL (Azul) -->
        <g class="flow-group flow-info">
          <!-- PMP a Comunicaciones -->
          <path d="M 190 160 L 190 380" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-info)" stroke-dasharray="5 3" />
          <text x="195" y="200" fill="#38bdf8" font-size="10" font-weight="600">RF BLOS</text>

          <!-- CPT a Comunicaciones -->
          <path d="M 500 160 L 500 200 L 250 200 L 250 380" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-info)" stroke-dasharray="5 3" />
          <text x="360" y="195" fill="#38bdf8" font-size="10" font-weight="600">RF LOS</text>

          <!-- UAV a Comunicaciones -->
          <path d="M 960 160 L 960 210 L 350 210 L 350 380" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-info)" stroke-dasharray="5 3" />
          <text x="700" y="205" fill="#38bdf8" font-size="10" font-weight="600">Relé Vídeo / Datos</text>

          <!-- Comunicaciones (--> Navegación (Bus Interno CAN / Ethernet) -->
          <line x1="385" y1="425" x2="435" y2="425" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-info)" />
          <text x="390" y="415" fill="#38bdf8" font-size="9" font-weight="bold">Bus CAN</text>

          <!-- Navegación --> Tren de Rodaje (Drive-by-Wire: Dirección y Tracción) -->
          <path d="M 600 470 L 600 630" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-info)" />
          <text x="608" y="555" fill="#38bdf8" font-size="10" font-weight="600">Consignas Drive-by-Wire</text>

          <!-- Navegación (--> Planta Motriz (Consignas PMS y demanda de potencia) -->
          <path d="M 435 450 L 385 450 L 385 520" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-info)" />
          <text x="390" y="490" fill="#38bdf8" font-size="9" font-weight="600">PMS Control</text>

          <!-- Navegación (--> Cargas de Pago (Datos de Misión) -->
          <path d="M 765 425 L 840 425" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-info)" />
          <text x="770" y="415" fill="#38bdf8" font-size="10" font-weight="600">Control Misión</text>
        </g>

        <!-- 2. FLUJOS DE ENERGÍA Y POTENCIA (Verde) -->
        <g class="flow-group flow-energy">
          <!-- Planta Motriz --> Tren de Rodaje (Potencia Eléctrica de Tracción) -->
          <path d="M 220 605 L 220 630" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrow-energy)" />
          <text x="228" y="622" fill="#34d399" font-size="10" font-weight="bold">Tracción Eléctrica</text>

          <!-- Planta Motriz --> Navegación / Comunicaciones (Aviónica 24V / 48V) -->
          <path d="M 220 500 L 220 470" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-energy)" />
          <text x="140" y="488" fill="#34d399" font-size="9" font-weight="bold">Alimentación Aviónica</text>

          <!-- Planta Motriz --> Cargas de Pago (Alimentación de Módulo) -->
          <path d="M 385 570 L 800 570 L 800 500 L 840 500" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-energy)" />
          <text x="700" y="562" fill="#34d399" font-size="10" font-weight="bold">Potencia Carga Pago</text>

          <!-- Planta Motriz --> Estación Recarga UAV (Techo) -->
          <path d="M 385 530 L 415 530 L 415 270 L 870 270 L 870 160" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-energy)" stroke-dasharray="4 2" />
          <text x="650" y="265" fill="#34d399" font-size="9" font-weight="bold">Recarga Batería UAV</text>
        </g>

        <!-- 3. SOPORTE MECÁNICO Y ESTRUCTURAL (Ámbar) -->
        <g class="flow-group flow-mechanical">
          <!-- Barcaza soporta Tren de Rodaje -->
          <line x1="100" y1="355" x2="100" y2="630" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" />
          <text x="105" y="580" fill="#f59e0b" font-size="9">Montaje Suspensión</text>

          <!-- Barcaza fija Cargas de Pago -->
          <line x1="765" y1="315" x2="840" y2="315" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-mech)" />
          <text x="770" y="305" fill="#f59e0b" font-size="9" font-weight="bold">Anclaje Mecánico</text>
        </g>

      
</svg>
